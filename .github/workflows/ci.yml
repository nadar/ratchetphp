name: "CI"

on:
  pull_request:
  push:
    branches:
      - "master"

jobs:
  phpunit:
    name: "PHPUnit (PHP ${{ matrix.php-version }})"
    runs-on: "ubuntu-latest"

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.5"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 2

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: "none"
          ini-values: "zend.assertions=1, error_reporting=E_ALL"

      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v3"
        with:
          dependency-versions: "highest"

      - name: "Run PHPUnit"
        run: "vendor/bin/phpunit"

  php-compatibility:
    name: "PHP 8.5 compatibility (PHPCompatibility)"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.5"
          coverage: "none"

      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v3"

      - name: "Check PHP 8.5 compatibility"
        run: "composer compat"

  coding-standards:
    name: "Coding Standards (PHP_CodeSniffer)"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.5"
          coverage: "none"

      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v3"

      - name: "Run PHP_CodeSniffer"
        run: "composer lint"
